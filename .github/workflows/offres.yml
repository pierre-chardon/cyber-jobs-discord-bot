name: Offres cyber

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 minutes, a :07 et :37 (creneaux moins charges)
  workflow_dispatch:          # bouton pour lancer le bot a la main

permissions:
  contents: write             # pour enregistrer la liste des offres deja publiees

concurrency:
  group: offres-cyber         # jamais deux passages en meme temps

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bot_offres.py
        env:
          # France
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ZONE: "France"   # ou "Ile-de-France" pour limiter a la region
          FT_REGION: "11"
          # Suisse
          DISCORD_WEBHOOK_CH: ${{ secrets.DISCORD_WEBHOOK_CH }}
          JOOBLE_KEY_CH: ${{ secrets.JOOBLE_KEY_CH }}
          ZONE_CH: "Schweiz"
      - name: Enregistrer les offres deja publiees
        run: |
          # On met la memoire de cote, on recupere la derniere version du depot
          # (au cas ou un fichier a ete modifie pendant le passage), puis on la remet.
          mkdir -p /tmp/memoire
          cp deja_publiees*.json /tmp/memoire/ 2>/dev/null || exit 0
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/memoire/*.json .
          git add deja_publiees*.json
          if [ -n "$(git diff --cached --name-only)" ]; then
            git config user.name "bot-offres"
            git config user.email "bot-offres@users.noreply.github.com"
            git commit -m "Mise a jour des offres publiees"
            git push
          fi
